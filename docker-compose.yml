services:
  postgres:
    image: pgvector/pgvector:pg17
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [core]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    profiles: [core]
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Bolum 29. Under `full` because the image is large and most work does not
  # need it: `make dev` stays a 700 MB affair.
  latex:
    build: ./docker/latex
    profiles: [full]
    ports: ["8090:8090"]
    # ⚠️ Development only. In production this container sits on an internal
    # network with no route out and no published port (Bolum 29.3,
    # docker-compose.prod.yml) — the backend reaches it from inside that
    # network.
    #
    # Here it cannot: `make dev` runs the backend on the host, and Docker does
    # not publish ports for a container attached only to an internal network,
    # so the host would have no way in. Local content is the developer's own,
    # and the difference is stated rather than discovered.
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1G }

volumes:
  pgdata:
