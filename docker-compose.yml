services:
  postgres:
    image: pgvector/pgvector:pg17
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [core]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    profiles: [core]
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Bolum 29. Under `full` because the image is large and most work does not
  # need it: `make dev` stays a 700 MB affair.
  latex:
    build: ./docker/latex
    profiles: [full]
    ports: ["8090:8090"]
    # ⚠️ Development only. In production this container sits on an internal
    # network with no route out and no published port (Bolum 29.3,
    # docker-compose.prod.yml) — the backend reaches it from inside that
    # network.
    #
    # Here it cannot: `make dev` runs the backend on the host, and Docker does
    # not publish ports for a container attached only to an internal network,
    # so the host would have no way in. Local content is the developer's own,
    # and the difference is stated rather than discovered.
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1G }

  # Bolum 28. Also under `full`: the first run downloads ~2.5 GB of model
  # weights, which is not something `make dev` should ever do on its own.
  embeddings:
    # 1.7 and not 1.5, and this is not a routine bump. On 1.5 the container
    # never started here at all: it fetched two of the model's config files and
    # then died on the third with "relative URL without a base", which is a bug
    # in that release's downloader and not a network problem. The volume stayed
    # empty, every embedding call failed, and Faz B fell back to keyword-only
    # weights — where most atoms score 0.0 and selection stops meaning anything.
    # That is what EMBEDDING_UNAVAILABLE was on 2026-09-02, and why a generation
    # dropped Education and Languages for no reason anyone could see.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    profiles: [full]
    # --max-batch-tokens, and it is what makes this container start at all.
    # TEI defaults to 16384 and allocates a batch that size while warming up,
    # which OOM-killed it at both 4G and 8G. Bolum 28 embeds atoms and a job
    # posting -- a bullet is tens of tokens, not thousands -- so the default is
    # sized for a workload this system does not have.
    #
    # --max-client-batch-size is a workaround and should not stay one. TEI
    # allows 32 per request by default and EmbeddingService sends a profile's
    # atoms in a single call, so an 84-atom profile came back 413 "batch size
    # 84 > maximum allowed batch size 32". Every profile larger than 32 atoms
    # has therefore never embedded against a real TEI; the 28-atom one that
    # used to be here fitted under the limit and hid it. The client is what
    # needs to chunk -- raising a server limit only moves where it breaks.
    command: ["--model-id", "BAAI/bge-m3", "--port", "8081",
              "--max-batch-tokens", "2048",
              "--max-client-batch-size", "512"]
    ports: ["8081:8081"]
    # The weights outlive the container. Without this every `docker compose
    # down` costs the 2.5 GB download again.
    volumes: [modelcache:/data]
    environment:
      # The container writes its cache here; /data is the volume above.
      HUGGINGFACE_HUB_CACHE: /data
    healthcheck:
      # /health is TEI's own; it answers only once the model is loaded, which
      # is what "ready" has to mean here — the port opens well before that.
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      # Generous: the first start includes the download.
      retries: 60
    deploy:
      resources:
        # 8G and not 4G, measured rather than guessed: at 4G the container was
        # OOM-killed during "Warming up model" every time — `OOMKilled=true`,
        # exit 137 — after downloading the weights successfully. bge-m3's ONNX
        # weights are ~2.2 GB and warmup holds more than that at once, so the
        # limit was below what the model this file names has ever needed. It
        # never started here, which is the other half of why Faz B ran on
        # keyword-only weights.
        limits: { cpus: '2', memory: 8G }

volumes:
  pgdata:
  modelcache:
