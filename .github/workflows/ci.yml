name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6.3.0

      # Bolum 47.1's format gate. First, because a failure here is a one-line
      # fix and finding it after a twelve-minute test run wastes the run.
      - name: Format
        run: ./gradlew spotlessCheck

      - name: Compile
        run: ./gradlew build -x test

      - name: Unit and architecture tests
        run: ./gradlew test

      # Testcontainers; the ubuntu runner ships a working Docker daemon.
      - name: Integration tests
        run: ./gradlew integrationTest

      # Always, not only on failure: a suite that silently runs zero tests
      # also reports success, and the run logs do not show the count.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      # Bolum 47.1's `publish-schema`, which never existed. The document is
      # produced and checked by the integration step above -- OpenApiDocumentIT
      # compares what the endpoints publish against the committed openapi.json,
      # so this step only carries the file out. The frontend fetches the
      # committed copy from raw.githubusercontent for its contract check; the
      # artifact is for a run that has not been merged yet.
      - name: Publish the API schema
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-schema
          path: openapi.json
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4

  scan:
    name: Misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Scaffolding for now: Trivy's misconfiguration checks cover Dockerfiles,
      # Kubernetes, Terraform and CloudFormation, none of which exist yet, so
      # this currently finds nothing to scan. It starts earning its place with
      # the LaTeX container in Stage 1, and gains an image scan alongside it.
      # Secrets are deliberately left to gitleaks so a single leak does not
      # turn two jobs red.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Bolum 47.1's third job, and it is deliberately the only one that can cost
  # money -- about $0.30 a run (Bolum 53.7). It fires on a pull request that
  # touches a prompt and on nothing else: the scores are a property of the
  # prompt, and rerunning them against an unchanged one buys a second copy of
  # yesterday's answer.
  #
  # `continue-on-error` is not set. Bolum 53.5 has a blocker -- inventing a
  # technology, zero tolerance -- and a gate that only warns is not a gate.
  llm-eval:
    name: Prompt evaluation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did a prompt change?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^src/main/resources/prompts/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No prompt changed; the scores would be yesterday's." >&2
          fi

      - uses: actions/setup-java@v6
        if: steps.changed.outputs.run == 'true'
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6.3.0
        if: steps.changed.outputs.run == 'true'

      # Real calls need a real key. Without one the lane cannot run, and
      # saying so is better than a green job that scored nothing (Bolum 51.7,
      # rule 3): a suite that runs zero tests also reports success.
      - name: Evaluate
        if: steps.changed.outputs.run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set; the prompt evaluation did not run"
            exit 0
          fi
          ./gradlew llmEval

      - name: Upload the report
        if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: llm-eval-report
          path: |
            build/reports/tests/llmEval/
            build/test-results/llmEval/
          retention-days: 14
