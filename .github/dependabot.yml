version: 2

# Dependency vulnerability coverage. The OWASP dependency-check Gradle plugin
# named in Bolum 47.1 is deliberately not used: it needs an NVD API key and its
# scan is slow and rate-limited without one. Dependabot alerts cover the same
# ground with no build-time cost.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Bolum 5.1 specifies Spring Boot 3.x. Spring Boot 4 sits on Spring
      # Framework 7 and is a migration project of its own, not something to
      # take through an automated bump. Patch and minor updates still come
      # through; revisit this deliberately when the time comes.
      - dependency-name: org.springframework.boot
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
