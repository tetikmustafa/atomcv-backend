# Read by tests; changing a number here is a deliberate decision
# that shows up in a pull request.
#
# **Deliberately generous — two to three times the figures.** The aim
# is not micro-optimisation: a CI machine's speed varies by more than the
# difference these would measure, so a tight budget would fail for the weather.
# What these catch is somebody adding an O(n squared) loop, and that shows up
# at any multiple.
#
# The sharper guards are elsewhere and are not timings at all: a query count
# for the N+1 that is the most likely performance bug here, and a
# scaling ratio for the pure phases, which is immune to how fast the machine is
# because it compares one run to another on the same one.
# Every number below is read by a test. Three were not, until an audit
# looked (denetim, beşinci tur): phase_scoring had no test at all,
# profile_load had none either, and a `p50_ms` on each of the three was
# read by nothing anywhere. A figure in this file that nothing asserts is
# the thing it was written to prevent -- a limit somebody believes is
# being held.
#
# There is no p50 here any more, and that is a consequence of how these are
# measured rather than an omission. The scaling tests take the *fastest* of
# fifteen samples on purpose, because noise only ever inflates a timing and
# the fastest run is the one nothing interrupted. A median over the same
# samples measures the machine's mood, so it was a number with no method
# behind it.
backend:
  # Chapter 52.1 asks for 30/60ms. Faz B is pure arithmetic over atoms in
  # memory once the vectors are there; held by ScoringScalingTest.
  phase_scoring: { p95_ms: 180 }
  # 15/40ms. Faz C is bin packing over the same atoms; held by
  # SelectionScalingTest.
  phase_selection: { p95_ms: 120 }

# The real budget, and the whole budget for a profile load: flat queries and
# an in-memory join, never a walk that asks per row. Six is the ceiling a
# profile load is designed around -- four flat queries and room for two -- and
# it is a count rather than a duration, so it means the same thing on every
# machine.
#
# The milliseconds that used to sit above for profile_load are gone rather
# than given a test. A load goes to a database, so timing it measures
# Testcontainers starting up and the disk underneath it; this count is what
# actually catches the N+1, which is the performance bug this design is most
# likely to grow. Held by ProfileAssemblerIT.
queries:
  profile_load_max: 6

# What a doubling of the input is allowed to cost. Linear work doubles;
# anything quadratic is four times, so a ceiling between the two catches the
# loop without caring about the machine.
scaling:
  max_growth_when_input_doubles: 3.0
