spring:
  application:
    name: atomcv-backend

  jpa:
    # ABSOLUTE RULE: always `validate`. Never `update`, never `create`.
    # The schema is owned solely by Flyway.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    validate-on-migrate: true

  servlet:
    multipart:
      # Bolum 42.1's ten megabytes, refused by the container before the bytes
      # reach a handler. `atomcv.ingestion.max-bytes` restates it one layer in;
      # both are needed, because only the inner one can name the error the
      # client renders and only the outer one refuses before buffering.
      max-file-size: ${UPLOAD_MAX_SIZE:10MB}
      # A CV upload is one part plus a field or two, so the request cannot be
      # much larger than the file. Left at the container default it is
      # unbounded, which makes the file limit above easy to walk around.
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

server:
  error:
    include-stacktrace: never
    include-message: never
  # Adim 3.3, dilim 4. Who the caller is decides which rate limit bucket they
  # land in, and behind a proxy `getRemoteAddr()` is the proxy. `framework`
  # lets Spring's ForwardedHeaderFilter rewrite the request from the headers
  # the proxy sets; `none` keeps them ignored, which is the only safe reading
  # when anything can reach this port directly. Production sets it, and the
  # trap it avoids is written down in spec/11-operations.md Bolum 46.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Bolum 44.3's counters, and everything else Micrometer already collects,
  # pushed over OTLP. Off unless a URL is given: an exporter with nowhere to
  # send retries on a timer and fills the log with its own failure, which is
  # observability making the system worse.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_ENABLED:false}
        url: ${OTLP_URL:}
        headers:
          # Axiom authenticates the push and names the dataset in headers.
          Authorization: ${OTLP_AUTHORIZATION:}
          X-Axiom-Dataset: ${OTLP_DATASET:}
  metrics:
    tags:
      # Without these every deployment's numbers arrive in one undifferentiated
      # stream and "is this staging?" becomes unanswerable.
      application: atomcv-backend
      environment: ${DEPLOY_ENV:local}

# ── Errors (EK C.1) ───────────────────────────────────────────────────────
# Absent unless a DSN is given, which is every profile but prod: the SDK is a
# no-op with an empty DSN, so a developer's stack traces stay on the developer's
# machine and no test ever posts to a vendor.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${DEPLOY_ENV:local}
  # Absolute rule 4 reaches the error tracker too. On, this attaches request
  # bodies, headers, cookies and the caller's address to every event -- a job
  # description and a CV among them. The stack trace and the request line are
  # what a fix needs; the content is not.
  send-default-pii: false
  # Errors only. Sentry's performance tracing would sample the request path,
  # and the numbers that answer "how slow is a generation" already go to Axiom
  # over OTLP -- a second, differently-sampled copy would just disagree.
  traces-sample-rate: 0
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

# ── LLM (Bolum 27.3) ──────────────────────────────────────────────────────
# Model ids are environment variables, never literals: vendors rename models
# faster than a release cycle (Bolum 5.4). A provider with no key is skipped
# silently, so one chain definition serves a deployment with one vendor
# configured and a deployment with five.
atomcv:
  # Bolum 53.2: the live version of each prompt, so rolling one back is a
  # value change rather than a release.
  prompts:
    active:
      job_analysis: v1
      profile_extraction: v1
      translation: v1
      bullet_rewrite: v1
      about_synthesis: v1
      cover_letter: v1
  # Bolum 28. Self-hosted BGE-M3 behind text-embeddings-inference; the CV
  # content never leaves the deployment.
  embedding:
    base-url: ${EMBEDDINGS_URL:http://localhost:8081}

  # Bolum 40.1 and EK D.6.6. Redis holds the session; the cookie only points
  # at it, so revoking is a DEL rather than the impossibility it is with a JWT.
  session:
    ttl: ${SESSION_TTL:30d}
    # Bolum 9's two hours for somebody who has not signed in, and EK D.6.6's
    # note that they slide: an absolute two hours would cut off a person
    # working through the review screen, which is the lost effort P8 exists
    # to prevent.
    anonymous-ttl: ${ANONYMOUS_SESSION_TTL:2h}
    # How much activity has to pass before the sliding TTL is rewritten. Two
    # orders below the shortest TTL: an active browser stays alive, and a read
    # does not carry a write.
    touch-interval: ${SESSION_TOUCH_INTERVAL:5m}
    # Adim 3.3: no leading dot. `.mustafatetik.com` would send the session to
    # the portfolio site on the same apex. Empty everywhere but production,
    # where the host is the only host.
    domain: ${SESSION_COOKIE_DOMAIN:}
    secure: ${SESSION_COOKIE_SECURE:true}

  # Bolum 40.2. Resend where there is a key, SMTP where there is not --
  # locally that means Mailpit, so the email is read the way a person reads it.
  email:
    # Has to live under the verified subdomain of Adim 3.2: SPF and DKIM are
    # published there and nowhere else, so a From on the apex fails both.
    from: ${EMAIL_FROM:no-reply@localhost}
    from-name: ${EMAIL_FROM_NAME:AtomCV}
    reply-to: ${EMAIL_REPLY_TO:}
    resend-key: ${RESEND_API_KEY:}
    # The endpoint secret from Resend's dashboard, `whsec_...`. Empty refuses
    # every delivery, deliberately: see EmailWebhooks.
    webhook:
      secret: ${RESEND_WEBHOOK_SECRET:}

  # Bolum 40.3. The link points at a page on the frontend, not at this API:
  # mail scanners follow links, and a one-shot token spent by a scanner is a
  # sign-in the person never got. Redemption is the POST that page makes.
  magic-link:
    verify-base-url: ${APP_BASE_URL:http://localhost:3000}
    verify-path: ${MAGIC_LINK_VERIFY_PATH:/verify}

  # Bolum 40.6. A provider with no credentials is absent, not broken — the
  # same shape Bolum 27.3 uses for LLM vendors, so one file serves a deployment
  # that registered one provider and one that registered both.
  oauth:
    # Where the provider sends the browser back. It has to be an origin the
    # frontend also serves: the session cookie is SameSite=Strict and the CSRF
    # token is read from document.cookie, so a callback landing on a different
    # origin than the app arrives with neither.
    redirect-base-url: ${APP_BASE_URL:http://localhost:3000}
    # Not the destination: a Strict cookie is withheld from a redirect chain
    # that began at the provider, so the client lands here and asks
    # /auth/session with a same-origin fetch before routing on.
    landing-path: ${OAUTH_LANDING_PATH:/auth/complete}
    error-path: ${OAUTH_ERROR_PATH:/auth/error}
    providers:
      google:
        client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
        client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
      github:
        client-id: ${OAUTH_GITHUB_CLIENT_ID:}
        client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:}

  # § 35.7 wrote down the anonymous capability set and never the account one.
  # This is that half, published to the frontend as B-044.
  capabilities:
    account-languages: ${CAPABILITY_ACCOUNT_LANGUAGES:en,tr}

  # Bolum 44.1. Two counters on purpose: with one limit somebody could spend
  # all of it on profile extraction, which is the most expensive call we make.
  quota:
    generations-per-user: ${QUOTA_GENERATIONS_PER_USER:20}
    profile-extracts-per-user: ${QUOTA_PROFILE_EXTRACTS_PER_USER:5}
    # Bolum 44.1's anonymous pair, and lower on purpose: an address is a
    # weaker claim about who is asking than an account, and it is what
    # somebody spending our money rotates.
    generations-per-ip: ${QUOTA_GENERATIONS_PER_IP:5}
    profile-extracts-per-ip: ${QUOTA_PROFILE_EXTRACTS_PER_IP:3}
    # Bolum 44.3's tightening. A daily ceiling says how much and never how
    # fast: a subject can spend the whole day in four minutes, and the detector
    # runs every fifteen. These two are what its alarm now does about that.
    tightened-per-hour: ${QUOTA_TIGHTENED_PER_HOUR:2}
    tighten-for: ${QUOTA_TIGHTEN_FOR:6h}

  # Bolum 44.4. The other half of what bounds the sign-in endpoint. Absent
  # locally and in the test suite, where ChallengeConfig warns and waves the
  # request through; absent under the `prod` profile, where it refuses to
  # start -- a deployment with no challenge works perfectly and is open, so
  # nobody would ever find out from the behaviour.
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY:}
    # Overridable so a test can point it at a socket it owns.
    verify-url: ${TURNSTILE_VERIFY_URL:}

  # Bolum 31.2's ladder. The size is Bolum 42.1's; the character floor is the
  # last rung, under which a PDF is taken to be a scan of a page rather than a
  # page -- there is no way to tell those apart from the text, and no real CV
  # is a hundred characters long.
  ingestion:
    max-bytes: ${UPLOAD_MAX_BYTES:10485760}
    min-extracted-chars: ${EXTRACTION_MIN_CHARS:100}

  # Bolum 40.5. Three layers in front of asking for a sign-in link, because
  # the endpoint sends mail to an address the caller merely typed. The numbers
  # are configuration: the global one is a guess at the sending provider's
  # tolerance, and a guess that needs a release to correct is a guess nobody
  # corrects.
  rate-limit:
    sign-in:
      per-email:
        limit: ${RATE_LIMIT_SIGN_IN_PER_EMAIL:3}
        window: ${RATE_LIMIT_SIGN_IN_PER_EMAIL_WINDOW:15m}
      per-ip:
        limit: ${RATE_LIMIT_SIGN_IN_PER_IP:10}
        window: ${RATE_LIMIT_SIGN_IN_PER_IP_WINDOW:1h}
      global:
        limit: ${RATE_LIMIT_SIGN_IN_GLOBAL:200}
        window: ${RATE_LIMIT_SIGN_IN_GLOBAL_WINDOW:1h}

  # Bolum 44.3. The brake still stops everybody and still waits for a person;
  # the heavy-user branch now narrows the one subject it was about, which is
  # what the section's snippet asked for and what was missing.
  anomaly:
    enabled: ${ANOMALY_DETECTION_ENABLED:true}
    baseline-factor: ${ANOMALY_BASELINE_FACTOR:5.0}
    signups-per-hour: ${ANOMALY_SIGNUPS_PER_HOUR:50}
    # The brake. Low on purpose: an ordinary day costs cents, and raising a
    # threshold that fired beats a bill nobody saw coming.
    daily-budget-usd: ${ANOMALY_DAILY_BUDGET_USD:10}

  # Bolum 57's retention promise, made true. Clears free text and keeps the
  # rows: a job's history is what retries and the anomaly detector count, and a
  # generation is what a download re-renders from. Runs after the nightly
  # backup so the last copy of a cleared row is at most a day old.
  retention:
    enabled: ${RETENTION_ENABLED:true}
    cron: ${RETENTION_CRON:0 30 3 * * *}
    job-payload: ${RETENTION_JOB_PAYLOAD:7d}
    job-description: ${RETENTION_JOB_DESCRIPTION:30d}

  # Bolum 30.4. Every instance works the queue and every instance reclaims
  # stale jobs, including its own — the condition is the heartbeat, not the
  # owner.
  jobs:
    worker:
      enabled: ${JOBS_WORKER_ENABLED:true}
      concurrency: ${JOBS_WORKER_CONCURRENCY:2}

  llm:
    # Bolum 27.4, USD per million tokens. Configuration because vendors change
    # prices faster than a release; an unpriced model costs zero and is
    # counted, never guessed at.
    #
    # F-015: this table listed a model no chain had run in months, so every
    # cost in the system was zero and the counter beside it was the only thing
    # that said so. LlmPricingAudit now names the gap at startup. Keep this
    # table and LLM_CHAIN_*/OPENROUTER_MODEL in step — a slug here that nobody
    # asks for is as useless as a slug nobody priced.
    #
    # A free model is written down as zero rather than left out: the figure is
    # the same, the claim is not. Left out means "we do not know".
    pricing:
      per-million-tokens:
        "[google/gemma-4-26b-a4b-it:free]":
          input: 0
          output: 0
          cached: 0
    chain:
      # Comma-separated, so the order is deployable without a release
      # (Bolum 5.4, "env-driven fallback"). Naming an adapter that does not
      # exist only logs a warning, but an order listing nothing runnable fails
      # every generation.
      #
      # Two vendors and not two models at one: Bolum 27.3's point is that the
      # links do not fail together, and OpenRouter is itself a broker -- a
      # second model behind it shares the broker's outage.
      cheap: ${LLM_CHAIN_CHEAP:openrouter,gemini}
      mid:   ${LLM_CHAIN_MID:openrouter,gemini}
    models:
      openrouter: ${OPENROUTER_MODEL:}
      gemini: ${GEMINI_MODEL:}
    call-timeout: 30s
    # Bolum 27.3 retries a schema mismatch on the same provider. One catches a
    # model that wandered; more pays repeatedly for a prompt that is wrong.
    schema-retries: 1
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:}

    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
