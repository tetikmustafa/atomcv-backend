spring:
  application:
    name: atomcv-backend

  jpa:
    # ABSOLUTE RULE: always `validate`. Never `update`, never `create`.
    # The schema is owned solely by Flyway.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    validate-on-migrate: true

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Bolum 44.3's counters, and everything else Micrometer already collects,
  # pushed over OTLP. Off unless a URL is given: an exporter with nowhere to
  # send retries on a timer and fills the log with its own failure, which is
  # observability making the system worse.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_ENABLED:false}
        url: ${OTLP_URL:}
        headers:
          # Axiom authenticates the push and names the dataset in headers.
          Authorization: ${OTLP_AUTHORIZATION:}
          X-Axiom-Dataset: ${OTLP_DATASET:}
  metrics:
    tags:
      # Without these every deployment's numbers arrive in one undifferentiated
      # stream and "is this staging?" becomes unanswerable.
      application: atomcv-backend
      environment: ${DEPLOY_ENV:local}

# ── LLM (Bolum 27.3) ──────────────────────────────────────────────────────
# Model ids are environment variables, never literals: vendors rename models
# faster than a release cycle (Bolum 5.4). A provider with no key is skipped
# silently, so one chain definition serves a deployment with one vendor
# configured and a deployment with five.
atomcv:
  # Bolum 53.2: the live version of each prompt, so rolling one back is a
  # value change rather than a release.
  prompts:
    active:
      job_analysis: v1
  # Bolum 28. Self-hosted BGE-M3 behind text-embeddings-inference; the CV
  # content never leaves the deployment.
  embedding:
    base-url: ${EMBEDDINGS_URL:http://localhost:8081}

  # Bolum 40.1 and EK D.6.6. Redis holds the session; the cookie only points
  # at it, so revoking is a DEL rather than the impossibility it is with a JWT.
  session:
    ttl: ${SESSION_TTL:30d}
    # How much activity has to pass before the sliding TTL is rewritten. Two
    # orders below the shortest TTL: an active browser stays alive, and a read
    # does not carry a write.
    touch-interval: ${SESSION_TOUCH_INTERVAL:5m}
    # Adim 3.3: no leading dot. `.mustafatetik.com` would send the session to
    # the portfolio site on the same apex. Empty everywhere but production,
    # where the host is the only host.
    domain: ${SESSION_COOKIE_DOMAIN:}
    secure: ${SESSION_COOKIE_SECURE:true}

  # Bolum 40.6. A provider with no credentials is absent, not broken — the
  # same shape Bolum 27.3 uses for LLM vendors, so one file serves a deployment
  # that registered one provider and one that registered both.
  oauth:
    # Where the provider sends the browser back. It has to be an origin the
    # frontend also serves: the session cookie is SameSite=Strict and the CSRF
    # token is read from document.cookie, so a callback landing on a different
    # origin than the app arrives with neither.
    redirect-base-url: ${APP_BASE_URL:http://localhost:3000}
    # Not the destination: a Strict cookie is withheld from a redirect chain
    # that began at the provider, so the client lands here and asks
    # /auth/session with a same-origin fetch before routing on.
    landing-path: ${OAUTH_LANDING_PATH:/auth/complete}
    error-path: ${OAUTH_ERROR_PATH:/auth/error}
    providers:
      google:
        client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
        client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
      github:
        client-id: ${OAUTH_GITHUB_CLIENT_ID:}
        client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:}

  # § 35.7 wrote down the anonymous capability set and never the account one.
  # This is that half, published to the frontend as B-044.
  capabilities:
    account-languages: ${CAPABILITY_ACCOUNT_LANGUAGES:en,tr}

  # Bolum 44.1. Two counters on purpose: with one limit somebody could spend
  # all of it on profile extraction, which is the most expensive call we make.
  quota:
    generations-per-user: ${QUOTA_GENERATIONS_PER_USER:20}
    profile-extracts-per-user: ${QUOTA_PROFILE_EXTRACTS_PER_USER:5}

  # Bolum 44.3. Reports, does not act: there is no rate limiter to tighten and
  # the brake stops everybody, so an operator decides.
  anomaly:
    enabled: ${ANOMALY_DETECTION_ENABLED:true}
    baseline-factor: ${ANOMALY_BASELINE_FACTOR:5.0}
    signups-per-hour: ${ANOMALY_SIGNUPS_PER_HOUR:50}
    # The brake. Low on purpose: an ordinary day costs cents, and raising a
    # threshold that fired beats a bill nobody saw coming.
    daily-budget-usd: ${ANOMALY_DAILY_BUDGET_USD:10}

  # Bolum 30.4. Every instance works the queue and every instance reclaims
  # stale jobs, including its own — the condition is the heartbeat, not the
  # owner.
  jobs:
    worker:
      enabled: ${JOBS_WORKER_ENABLED:true}
      concurrency: ${JOBS_WORKER_CONCURRENCY:2}

  llm:
    # Bolum 27.4, USD per million tokens. Configuration because vendors change
    # prices faster than a release; an unpriced model costs zero and is
    # counted, never guessed at.
    #
    # F-015: this table listed a model no chain had run in months, so every
    # cost in the system was zero and the counter beside it was the only thing
    # that said so. LlmPricingAudit now names the gap at startup. Keep this
    # table and LLM_CHAIN_*/OPENROUTER_MODEL in step — a slug here that nobody
    # asks for is as useless as a slug nobody priced.
    #
    # A free model is written down as zero rather than left out: the figure is
    # the same, the claim is not. Left out means "we do not know".
    pricing:
      per-million-tokens:
        "[google/gemma-4-26b-a4b-it:free]":
          input: 0
          output: 0
          cached: 0
    chain:
      # Comma-separated, so the order is deployable without a release
      # (Bolum 5.4, "env-driven fallback"). Bolum 27.3's fuller order arrives
      # with the other adapters: naming one that does not exist yet only logs
      # a warning, but an order listing nothing runnable fails every
      # generation, so the default names the adapter that exists.
      cheap: ${LLM_CHAIN_CHEAP:openrouter}
      mid:   ${LLM_CHAIN_MID:openrouter}
    models:
      openrouter: ${OPENROUTER_MODEL:}
    call-timeout: 30s
    # Bolum 27.3 retries a schema mismatch on the same provider. One catches a
    # model that wandered; more pays repeatedly for a prompt that is wrong.
    schema-retries: 1
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
