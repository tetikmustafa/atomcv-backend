# Daily work: no provider is called and nothing is spent.
#
# Until this file existed Spring accepted `--spring.profiles.active=local,local-fake`
# and ignored the second half silently, so `make dev` looked like it was
# running in fake mode while adding nothing at all.
atomcv:
  # No LaTeX container under `make dev`: the image belongs to `make dev-full`.
  # A switch rather than the profile alone, because the latex test lane runs
  # under this very profile -- it wants the fake model and the real compiler --
  # and AbstractLatexTest turns this back off.
  latex:
    fake: true
  llm:
    # Both chains point at the fake, and nothing else. The base configuration
    # names openrouter, which has no key here — a chain that found nothing
    # available would fail every generation with ALL_PROVIDERS_UNAVAILABLE,
    # which is exactly what "no cost, works offline" must not mean.
    chain:
      cheap: [fake]
      mid:   [fake]
    fake:
      # Where `local-record` writes and this profile reads. Relative to the
      # working directory, which is the repository root under `make dev`.
      fixture-dir: src/test/resources/fixtures/llm
      # A call no fixture covers still answers, shaped like the schema. Off
      # would mean a fresh clone cannot run a generation at all.
      synthesize: true

logging:
  level:
    com.mustafatetik.atomcv.llm: debug
