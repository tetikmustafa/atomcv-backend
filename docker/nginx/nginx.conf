# Bolum 11.2. One domain: atomcv.mustafatetik.com/api/* is the backend and
# everything else is the frontend. No api. subdomain, deliberately -- CORS
# never enters the picture and SameSite=Strict cookies work (Bolum 11.2).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # An upload is ten megabytes (Bolum 42.1) and nginx refuses larger before
    # the application reads a byte. The ladder inside refuses the same size
    # again -- this one just means the bytes never arrive.
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Bolum 11.2's two zones. This is the outer layer; Bolum 40.5's three
    # counters live in the application and know who is asking. Nginx knows only
    # an address, which is why the auth zone is the strict one.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    # Forwarded to the backend, which reads it as the caller (Bolum 46.5).
    # FORWARD_HEADERS_STRATEGY=framework is what makes this arrive as the
    # caller's address rather than as nginx's -- without it every request looks
    # like one client and the per-IP limiter becomes one shared bucket.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https https;
    }

    server {
        listen 80;
        server_name atomcv.mustafatetik.com;

        # The renewal check has to reach a plain-http path or certbot cannot
        # answer its own challenge on a server that redirects everything.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name atomcv.mustafatetik.com;

        ssl_certificate     /etc/letsencrypt/live/atomcv.mustafatetik.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atomcv.mustafatetik.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # The frontend's headers. The API sets its own in SecurityConfig, and
        # `always` here would not override those -- add_header does not replace
        # a header the upstream already sent.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

        # Bolum 30.6's stream, and the three lines that make it one. Buffering
        # on would hold every phase event until the generation finished and
        # deliver the whole progress bar at once, after the thing it was
        # reporting on was over.
        location /api/v1/jobs/ {
            proxy_pass http://backend:8080;
            include /etc/nginx/proxy_params.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # Signing in is the expensive thing to guess at, so it gets the strict
        # zone. Burst 3 matches Bolum 40.5's per-address allowance closely
        # enough that a person never meets this one and a script always does.
        location /api/v1/auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://backend:8080;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:8080;
            include /etc/nginx/proxy_params.conf;
            # A generation is a queued job and answers in milliseconds; this
            # covers the uploads, which read a document before answering.
            proxy_read_timeout 60s;
        }

        # Reachable from the host for scripts/deploy.sh, and from nowhere else:
        # an actuator on the public internet publishes what is running.
        location /actuator/ {
            deny all;
        }

        location / {
            proxy_pass http://frontend:3000;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
