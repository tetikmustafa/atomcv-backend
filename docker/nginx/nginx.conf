# One domain: atomcv.mustafatetik.com/api/* is the backend and
# everything else is the frontend. No api. subdomain, deliberately -- CORS
# never enters the picture and SameSite=Strict cookies work.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # An upload is ten megabytes and nginx refuses larger before
    # the application reads a byte. The ladder inside refuses the same size
    # again -- this one just means the bytes never arrive.
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # The two zones. This is the outer layer; the three
    # counters live in the application and know who is asking. Nginx knows only
    # an address, which is why the auth zone is the strict one.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    # Forwarded to the backend, which reads it as the caller.
    # FORWARD_HEADERS_STRATEGY=framework is what makes this arrive as the
    # caller's address rather than as nginx's -- without it every request looks
    # like one client and the per-IP limiter becomes one shared bucket.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https https;
    }

    server {
        listen 80;
        server_name atomcv.mustafatetik.com;

        # The renewal check has to reach a plain-http path or certbot cannot
        # answer its own challenge on a server that redirects everything.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name atomcv.mustafatetik.com;

        ssl_certificate     /etc/letsencrypt/live/atomcv.mustafatetik.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atomcv.mustafatetik.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # The frontend's headers. The API sets its own in SecurityConfig, and
        # `always` here would not override those -- add_header does not replace
        # a header the upstream already sent.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # The policy, plus the one host it has to name. Turnstile
        # is a script this origin loads and an iframe this
        # origin embeds, so `default-src 'self'` blocks both -- silently, the
        # way CSP always does. The widget never renders, the token is never
        # produced, and every guarded endpoint answers CHALLENGE_FAILED: sign
        # in, anonymous import and anonymous generation, all three, on a
        # deployment whose every test was green.
        #
        # `script-src` for api.js and `frame-src` for the challenge frame are
        # what Cloudflare's own CSP guidance asks for, and nothing else: the
        # requests the widget makes afterwards come from inside that frame,
        # which carries its own origin and its own policy.
        #
        # Fonts need no host of their own -- `next/font/google` downloads them
        # at build time and serves them from /_next/static, which is 'self'.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src https://challenges.cloudflare.com" always;

        # The stream, and the three lines that make it one. Buffering
        # on would hold every phase event until the generation finished and
        # deliver the whole progress bar at once, after the thing it was
        # reporting on was over.
        location /api/v1/jobs/ {
            proxy_pass http://backend:8080;
            include /etc/nginx/proxy_params.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # The warm-up is an operational lever with a URL, not part
        # of the API. `deploy.sh` calls it on the host, before traffic; from
        # outside it is a way to make the server work for nothing. Exact-match
        # location, so it beats the /api/ prefix below.
        location = /api/v1/warmup {
            deny all;
        }

        # Signing in is the expensive thing to guess at, so it gets the strict
        # zone. Burst 3 matches the per-address allowance closely
        # enough that a person never meets this one and a script always does.
        location /api/v1/auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://backend:8080;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:8080;
            include /etc/nginx/proxy_params.conf;
            # A generation is a queued job and answers in milliseconds; this
            # covers the uploads, which read a document before answering.
            proxy_read_timeout 60s;
        }

        # Reachable from the host for scripts/deploy.sh, and from nowhere else:
        # an actuator on the public internet publishes what is running.
        location /actuator/ {
            deny all;
        }

        # The analytics, under a path on this domain rather than a
        # subdomain of its own. Same origin is the whole reason: the tracker
        # script is then 'self' to the Content-Security-Policy above, and the
        # requests it makes are too. A subdomain would need both named.
        #
        # **Through a variable, and that is not style.** nginx resolves a
        # literal upstream name once, at start-up, and refuses to start at all
        # when it does not resolve -- so with the analytics profile down (which
        # is the default) a literal `proxy_pass http://umami:3000` would take
        # the entire site with it. A variable defers the lookup to the request,
        # which needs a resolver: 127.0.0.11 is Docker's embedded DNS.
        #
        # The honest answer then is a 502 on this path alone: the service is
        # optional and nothing in the product depends on it.
        location /analytics/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $umami_upstream http://umami:3000;
            proxy_pass $umami_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass http://frontend:3000;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
