# What every proxied location forwards, in one place.
#
# `X-Forwarded-For` is the one that matters: Bolum 40.5 counts sign-in attempts
# per address, and the application reads the caller from this header because
# nginx is the only way in (Bolum 46.5, FORWARD_HEADERS_STRATEGY=framework).
# Without it every caller arrives as the proxy and the per-IP layer becomes one
# bucket the whole deployment shares -- a limiter that looks configured and
# locks everybody out on the tenth request.
#
# It is set with $remote_addr and not appended to what arrived: a header a
# client can extend is a header a client can forge.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_scheme;
proxy_set_header X-Forwarded-Host $host;
