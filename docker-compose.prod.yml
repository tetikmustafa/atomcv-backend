# The topology, as the server actually runs it.
#
# Read with two env files, and the split is the point (XI-B.9.3):
#   .env         the deployment's secrets, written by hand, chmod 600
#   .env.deploy  the two image tags, written by scripts/deploy.sh
#
#   docker compose --env-file .env.deploy -f docker-compose.prod.yml up -d
#
# Two SHAs and not one: the repositories deploy independently, so there is no
# single commit that describes what is running.
name: atomcv

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on: [frontend, backend]

  frontend:
    image: ghcr.io/tetikmustafa/atomcv-frontend:${FRONTEND_SHA:-latest}
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }

  backend:
    image: ghcr.io/tetikmustafa/atomcv-backend:${BACKEND_SHA:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -Duser.language=en -Duser.country=US
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - LATEX_BASE_URL=http://latex:8090
      - EMBEDDING_BASE_URL=http://embeddings:8081
    # The port is published to localhost only: nginx reaches it over the
    # compose network, and scripts/deploy.sh health-checks it from the host.
    # Publishing it to 0.0.0.0 would put an unauthenticated API beside the one
    # nginx rate limits.
    ports: ["127.0.0.1:8080:8080"]
    # The class-data archive. A volume and not the container's own
    # layer: a deploy recreates the container, so an archive written inside it
    # would be written on every start and read on none. The JVM regenerates it
    # by itself when the jar changes, so one from the previous image is
    # replaced rather than used.
    volumes: [backendcache:/var/cache/atomcv]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      latex: { condition: service_started }
      embeddings: { condition: service_started }
    networks: [default, latex-isolated]
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1G }

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs on first initialisation only, which is the one chance there is to
      # create Umami's database beside the application's.
      - ./docker/postgres/init-umami.sql:/docker-entrypoint-initdb.d/10-umami.sql:ro
      # The archive lands here and `scripts/archive-wal.sh` ships it.
      # Postgres writes it, the host reads it -- which is why it is a named
      # volume and not a path inside pgdata: a recovery that restores the data
      # directory must not restore the segments that describe it.
      - walarchive:/wal-archive
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # The archive_command as it was first written calls rclone, and this
    # image does not carry it -- installing it would mean maintaining a
    # derivative of the pgvector image for one binary. Copying to a volume the
    # host already mounts gets the same segments to the same bucket, and keeps
    # the encryption on the host side where the age key already lives
    # (a segment holds the same CVs the dump does).
    #
    # `test ! -f` first, because Postgres may retry a segment it already
    # archived and an archive_command that overwrites can truncate a good file
    # with a partial one. Exit non-zero and Postgres keeps the segment and
    # tries again -- which is the behaviour wanted when the volume is full,
    # and the reason this is not `cp -f`.
    command: >
      postgres -c shared_buffers=256MB
               -c max_connections=50
               -c wal_level=replica
               -c archive_mode=on
               -c archive_command='test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
               -c archive_timeout=300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1G }
        reservations: { cpus: '0.5', memory: 768M }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions live here, so eviction is not free: allkeys-lru
    # signs people out under pressure rather than failing the write that would
    # have told us. 128M is far past what sessions and the analysis cache use.
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  latex:
    build: ./docker/latex
    restart: unless-stopped
    # Absolute rule 8's isolation, and the network is the half that matters:
    # this container compiles input derived from what a stranger uploaded.
    networks: [latex-isolated]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1G }

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    command: --model-id BAAI/bge-m3 --port 8081
    volumes: [modelcache:/data]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 2.5G }

  # The analytics: cookieless and self-hosted, which is what makes
  # The "no consent banner" true rather than merely claimed.
  #
  # Its own database on the same server and not the application's. Umami runs
  # its own migrations, and a tool that migrates a schema it shares with the
  # product is one upgrade away from an outage nobody planned.
  #
  # Behind a compose profile, so `up -d` does not start it until somebody has
  # set APP_SECRET and the frontend has a website id to report to:
  #
  #   docker compose --profile analytics -f docker-compose.prod.yml up -d
  #
  # A dashboard nothing reports to is half a gigabyte of an eight-gigabyte
  # machine spent on an empty page.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: [analytics]
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
      # Served under a path on the one domain. That is what keeps
      # the tracker script same-origin, so the Content-Security-Policy needs no
      # host of its own for it -- the opposite of Turnstile.
      - BASE_PATH=/analytics
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }

volumes:
  backendcache:
  pgdata:
  walarchive:
  redisdata:
  modelcache:
  certbot-certs:
  certbot-webroot:

networks:
  default:
  # No route out. The LaTeX container is reachable from the backend and can
  # reach nothing at all -- `internal: true` is what makes -no-shell-escape a
  # second lock rather than the only one.
  latex-isolated:
    internal: true
